<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p5Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#091c1a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#p5Dark)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect width="800" height="38" rx="12" fill="#0f172a"/>
  <rect y="18" width="800" height="20" fill="#0f172a"/>
  <circle cx="25" cy="19" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="19" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="59" cy="19" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="240" y="9" width="320" height="20" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="23" fill="#64748b" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">github.com/AruYQ/UniDemic</text>

  <!-- Banner -->
  <g transform="translate(18, 52)">
    <rect width="764" height="70" rx="8" fill="#0d111d" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="36" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">UniDemic <tspan fill="#94a3b8" font-size="12" font-weight="normal">| Your university life, organized</tspan></text>
    <text x="24" y="56" fill="#64748b" font-family="'Fira Code', monospace" font-size="11">Open-Source Cross-Platform Academic Productivity &amp; Collaboration for Students</text>

    <!-- 3 Pillars Grid -->
    <g transform="translate(0, 85)">
      <!-- Card 1 -->
      <rect width="244" height="280" rx="8" fill="#0d111d" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">📅 Schedule &amp; Deadlines</text>
      <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sinkronisasi otomatis jadwal kuliah, kalender akademik, dan deadline tugas terintegrasi.</text>
      <rect x="20" y="95" width="204" height="40" rx="6" fill="#151b2d"/>
      <text x="32" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Pemrograman Berorientasi Objek</text>
      <text x="32" y="130" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">Besok, 08:00 WIB • Ruang B201</text>
      <rect x="20" y="145" width="204" height="40" rx="6" fill="#151b2d"/>
      <text x="32" y="168" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Tugas Jaringan Komputer</text>
      <text x="32" y="180" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="9">Deadline: 2 hari lagi</text>

      <!-- Card 2 -->
      <g transform="translate(260, 0)">
        <rect width="244" height="280" rx="8" fill="#0d111d" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="32" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🤝 Study Groups &amp; Vault</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Ruang kolaborasi berkas materi kuliah, catatan bersama, dan diskusi antarmahasiswa.</text>
        <rect x="20" y="95" width="204" height="60" rx="6" fill="#151b2d"/>
        <text x="32" y="118" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Shared Drive: Struktur Data</text>
        <text x="32" y="133" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">12 Berkas Modul Praktikum</text>
        <text x="32" y="146" fill="#10b981" font-family="'Fira Code', monospace" font-size="9">4 Kontributor Aktif</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(520, 0)">
        <rect width="244" height="280" rx="8" fill="#0d111d" stroke="#1e293b" stroke-width="1"/>
        <text x="20" y="32" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">🌐 Open Source Stack</text>
        <text x="20" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Arsitektur modular yang dirancang untuk pengembangan terbuka berbasis komunitas kampus.</text>
        <rect x="20" y="95" width="204" height="150" rx="6" fill="#070a10" stroke="#1e293b" stroke-width="1"/>
        <g transform="translate(32, 115)" font-family="'Fira Code', monospace" font-size="10" fill="#94a3b8">
          <text x="0" y="15" fill="#38bdf8">• Cross-Platform Client</text>
          <text x="0" y="35" fill="#10b981">• Modular REST API</text>
          <text x="0" y="55" fill="#f43f5e">• Auth &amp; Session Tokens</text>
          <text x="0" y="75" fill="#c084fc">• Realtime Notification</text>
          <text x="0" y="95" fill="#e2e8f0">• Open PRs &amp; Issues</text>
        </g>
      </g>
    </g>
  </g>
</svg>
