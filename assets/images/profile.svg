<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="500" height="500" rx="250" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.6"/>
  <circle cx="250" cy="250" r="215" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Glowing Aura Back -->
  <circle cx="250" cy="220" r="130" fill="#6366f1" opacity="0.15" filter="url(#glow)"/>

  <!-- IT Student Avatar Vector -->
  <g transform="translate(0, 15)">
    <!-- Shoulders / Jacket -->
    <path d="M120 460 C 130 360, 180 330, 250 330 C 320 330, 370 360, 380 460 Z" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <!-- Hoodie Inner / Shirt -->
    <path d="M190 350 L 250 420 L 310 350 Z" fill="#0f172a"/>
    <path d="M215 360 L 250 405 L 285 360 Z" fill="url(#accentGrad)" opacity="0.8"/>

    <!-- Neck -->
    <rect x="225" y="270" width="50" height="65" rx="10" fill="#e2e8f0"/>
    <path d="M225 295 C 240 310, 260 310, 275 295 L 275 325 L 225 325 Z" fill="#cbd5e1" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="250" cy="210" rx="65" ry="80" fill="#f1f5f9"/>

    <!-- Hair (Modern Stylish Tech cut) -->
    <path d="M175 195 C 170 140, 210 115, 255 115 C 310 115, 335 145, 325 195 C 315 155, 290 140, 250 140 C 210 140, 185 165, 175 195 Z" fill="#0f172a"/>
    <path d="M185 145 C 220 120, 280 120, 315 150 C 300 130, 260 125, 220 135 Z" fill="#334155"/>

    <!-- Glasses (Clean Modern IT vibe) -->
    <rect x="195" y="195" width="45" height="32" rx="8" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <rect x="260" y="195" width="45" height="32" rx="8" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <line x1="240" y1="210" x2="260" y2="210" stroke="#38bdf8" stroke-width="3.5"/>
    <path d="M195 205 L 180 200" stroke="#38bdf8" stroke-width="3"/>
    <path d="M305 205 L 320 200" stroke="#38bdf8" stroke-width="3"/>

    <!-- Eyes (behind glasses) -->
    <circle cx="217" cy="211" r="5" fill="#0f172a"/>
    <circle cx="283" cy="211" r="5" fill="#0f172a"/>
    <circle cx="219" cy="209" r="1.5" fill="#ffffff"/>
    <circle cx="285" cy="209" r="1.5" fill="#ffffff"/>

    <!-- Smile -->
    <path d="M232 250 Q 250 265 268 250" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Modern Floating Tech Badges -->
  <g transform="translate(60, 100)" filter="url(#glow)">
    <rect width="65" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="32" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">&lt;IT /&gt;</text>
  </g>

  <g transform="translate(370, 120)">
    <rect width="70" height="32" rx="16" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="35" y="21" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CODE</text>
  </g>

  <g transform="translate(340, 360)">
    <rect width="90" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="4" fill="#10b981"/>
    <text x="50" y="21" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AVAILABLE</text>
  </g>
</svg>
