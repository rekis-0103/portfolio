<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#150f24"/>
    </linearGradient>
    <linearGradient id="p3Purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="12" fill="url(#p3Dark)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Titlebar -->
  <rect width="800" height="38" rx="12" fill="#0f172a"/>
  <rect y="18" width="800" height="20" fill="#0f172a"/>
  <circle cx="25" cy="19" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="19" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="59" cy="19" r="5" fill="#10b981" opacity="0.8"/>
  <rect x="240" y="9" width="320" height="20" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <text x="400" y="23" fill="#64748b" font-family="'Fira Code', monospace" font-size="11" text-anchor="middle">axonote.ai/studio/quiz-generator</text>

  <!-- Content Split -->
  <g transform="translate(18, 52)">
    <!-- Left: Input Article / Summary -->
    <rect width="374" height="380" rx="8" fill="#0d111d" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" fill="#a855f7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">📄 DOKUMEN SUMBER &amp; RINGKASAN ML</text>
    
    <rect x="20" y="48" width="334" height="60" rx="6" fill="#151b2d" stroke="#1e293b" stroke-width="0.8"/>
    <text x="32" y="72" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Arsitektur Distributed Systems &amp; Consensus</text>
    <text x="32" y="92" fill="#64748b" font-family="'Fira Code', monospace" font-size="9.5">Input: 14 halaman PDF • 4,820 Kata</text>

    <text x="20" y="135" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Hasil Ekstraksi Ringkasan Otomatis:</text>
    <g transform="translate(20, 148)" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">
      <text x="0" y="15">• Algoritma Raft membagi masalah konsensus menjadi 3 sub-problem.</text>
      <text x="0" y="35">• Node state bertransisi antara Follower, Candidate, dan Leader.</text>
      <text x="0" y="55">• Log replication menjamin konsistensi linier pada node terdistribusi.</text>
      <text x="0" y="75">• Term number bertindak sebagai logical clock untuk identifikasi status.</text>
    </g>

    <rect x="20" y="250" width="334" height="1" fill="#1e293b"/>
    <text x="20" y="278" fill="#64748b" font-family="'Fira Code', monospace" font-size="10">Model Pipeline: Python • Transformers • FastAPI</text>
    
    <g transform="translate(20, 295)">
      <rect width="100" height="24" rx="4" fill="#8b5cf6" fill-opacity="0.15"/>
      <text x="50" y="16" fill="#a855f7" font-family="'Fira Code', monospace" font-size="9.5" text-anchor="middle">ROUGE-L: 0.88</text>

      <rect x="110" width="100" height="24" rx="4" fill="#10b981" fill-opacity="0.15"/>
      <text x="160" y="16" fill="#10b981" font-family="'Fira Code', monospace" font-size="9.5" text-anchor="middle">Latency: 1.4s</text>
    </g>
  </g>

  <!-- Right: Generated Quiz Output -->
  <g transform="translate(408, 52)">
    <rect width="374" height="380" rx="8" fill="#0d111d" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🎯 GENERATED QUIZ (AI OUTPUT)</text>

    <!-- Question 1 Card -->
    <g transform="translate(20, 50)">
      <rect width="334" height="145" rx="6" fill="#131929" stroke="#1e293b" stroke-width="0.8"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">PERTANYAAN 01 / 05</text>
      <text x="16" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Apa peran dari 'Term Number' pada protokol Raft?</text>
      
      <!-- Option A -->
      <rect x="16" y="60" width="302" height="26" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="28" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">A. Sebagai kunci enkripsi data payload</text>

      <!-- Option B (Correct) -->
      <rect x="16" y="92" width="302" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="28" y="109" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">✓ B. Sebagai logical clock untuk mendeteksi informasi basi</text>
    </g>

    <!-- Question 2 Card -->
    <g transform="translate(20, 210)">
      <rect width="334" height="120" rx="6" fill="#131929" stroke="#1e293b" stroke-width="0.8"/>
      <text x="16" y="24" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">PERTANYAAN 02 / 05</text>
      <text x="16" y="44" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Keadaan apa yang memicu transisi dari Follower ke Candidate?</text>
      <rect x="16" y="60" width="302" height="26" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="28" y="77" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">A. Terjadi election timeout tanpa heartbeat Leader</text>
    </g>

    <!-- Action Export -->
    <rect x="20" y="342" width="334" height="30" rx="6" fill="url(#p3Purple)"/>
    <text x="187" y="362" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Ekspor Kuis Interaktif (JSON / Flashcards)</text>
  </g>
</svg>
